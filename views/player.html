<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {{ if .competitionname }}🏆 {{ .competitionname }} |{{ end }}
        {{ if .eventname }}📺 {{ .eventname }} |{{ end }}
        {{ if .broadcastername }}🎙️ {{ .broadcastername }} {{ end }}
        {{ if .btntext }}🔗 {{ .btntext }}{{ end }}
    </title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="./css/player.css">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
    <link rel="manifest" href="/images/site.webmanifest">
    <meta name="theme-color" content="#ffffff">
</head>

<body>
    <div class="player-container">
        <span class="player-title">
            {{ if .competitionname }}🏆 {{ .competitionname }} |{{ end }}
            {{ if .eventname }}📺 {{ .eventname }} |{{ end }}
            {{ if .broadcastername }}🎙️ {{ .broadcastername }} {{ end }}
            {{ if .btntext }}🔗 {{ .btntext }}{{ end }}
        </span>

        <div class="video-container">
            <video id="videoPlayer" autoplay muted controls></video>
            <!-- <div id="statusMessage">Cargando reproductor...</div> -->
        </div>
        <div class="playback-settings">
            <h3><i class="fas fa-sliders-h"></i> Configuración de Reproducción</h3>
            <div class="settings-row">
                <div>
                    <label for="buffer-size">Tamaño del Búfer:</label>
                    <select id="buffer-size">
                        <option value="30">Bajo (30s)</option>
                        <option value="60" selected>Medio (60s)</option>
                        <option value="90">Alto (90s)</option>
                        <option value="120">Muy Alto (120s)</option>
                    </select>
                </div>

                <div>
                    <label for="latency-mode">Modo de Latencia:</label>
                    <select id="latency-mode">
                        <option value="low">Baja Latencia (Puede Bufferizar)</option>
                        <option value="medium" selected>Latencia Media</option>
                        <option value="high">Reproducción Suave (Alta Latencia)</option>
                    </select>
                </div>

                <div>
                    <label for="prebuffer-time">Tiempo de Pre-búfer:</label>
                    <select id="prebuffer-time">
                        <option value="3">3 segundos</option>
                        <option value="5" selected>5 segundos</option>
                        <option value="10">10 segundos</option>
                        <option value="15">15 segundos</option>
                    </select>
                </div>

                <button id="apply-settings" class="settings-btn"><i class="fas fa-check"></i> Aplicar
                    Configuración</button>
            </div>
        </div>
    </div>

</body>
<script>
    function getSettings() {
        const bufferSize = parseInt(document.getElementById('buffer-size').value);
        const latencyMode = document.getElementById('latency-mode').value;
        const prebufferTime = parseInt(document.getElementById('prebuffer-time').value);

        let maxBufferLength, maxMaxBufferLength, backBufferLength;

        switch (latencyMode) {
            case 'low':
                maxBufferLength = 15; // Bajo
                maxMaxBufferLength = 30;
                backBufferLength = 15;
                break;
            case 'medium':
                maxBufferLength = bufferSize; // Medio, usa el valor del select
                maxMaxBufferLength = bufferSize * 2;
                backBufferLength = bufferSize - 15; // Ajuste relativo
                break;
            case 'high':
            default:
                maxBufferLength = bufferSize; // Alto, usa el valor del select
                maxMaxBufferLength = bufferSize * 2;
                backBufferLength = bufferSize - 30; // Ajuste relativo
                break;
        }

        return {
            maxBufferLength: maxBufferLength,
            maxMaxBufferLength: maxMaxBufferLength,
            backBufferLength: backBufferLength,
            prebufferTime: prebufferTime // No se usa directamente en HLS.js config, pero puedes usarlo para lógica adicional
        };
    }

    function fromBase64Url(str) {
        const padding = '='.repeat((4 - str.length % 4) % 4);
        const base64 = (str + padding)
            .replace(/-/g, '+')
            .replace(/_/g, '/');
        return atob(base64);
    }

    const MAX_RETRIES = 2;

    function buildHlsUrl(linkID, pid) {
        const hostname = window.location.hostname
        return `http://${hostname}:6878/ace/manifest.m3u8?id=${linkID}&pid=${pid}`;
    }

    function isValidAceId(id) {
        return /^[a-fA-F0-9]{40}$/.test(id);
    }

    function showErrorOverlay(message, subMessage) {
        const videoContainer = document.querySelector('.video-container');
        if (!videoContainer) return;
        // no destruir el <video>, overlay absoluto
        let overlay = document.getElementById('hlsErrorOverlay');
        if (!overlay) {
            overlay = document.createElement('div');
            overlay.id = 'hlsErrorOverlay';
            overlay.style.cssText = 'position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.85);color:#ff4444;z-index:10;padding:20px;text-align:center;';
            videoContainer.style.position = 'relative';
            videoContainer.appendChild(overlay);
        }
        overlay.innerHTML = `
            <div style="font-size:48px;margin-bottom:10px;">⚠️</div>
            <h3>${message}</h3>
            <p>${subMessage}</p>
            <button onclick="hideErrorOverlay(); loadVideo();" class="settings-btn" style="margin-top:15px;">Reintentar</button>
        `;
        overlay.style.display = 'flex';
    }

    function hideErrorOverlay() {
        const overlay = document.getElementById('hlsErrorOverlay');
        if (overlay) overlay.style.display = 'none';
    }

    function loadVideo() {
        let linkID = "{{ .linkid }}";
        const pid = "{{ .pid }}";

        if (linkID == "") {
            return;
        }

        hideErrorOverlay();

        if (linkID.includes(";") === true) {
            const splitted = linkID.split(";")[1];
            let decoded = fromBase64Url(splitted);
            if (decoded.includes("p;")) {
                hlsUrl = `/api/iptv/${linkID}`;
            } else {
                hlsUrl = decoded;
            }
            loadHlsVideo(hlsUrl, linkID, pid, 0);
            return;
        }
        // validación solo para IDs AceStream puros (40 hex)
        if (!isValidAceId(linkID)) {
            console.error(`ID AceStream inválido: "${linkID}" (debe ser 40 hex). No se pide al engine.`);
            showErrorOverlay('ID de stream inválido', `El identificador "${linkID}" no es un hash AceStream válido y no se puede cargar.`);
            return;
        }
        loadHlsVideo(buildHlsUrl(linkID, "{{ .pid }}"), linkID, "{{ .pid }}", 0);
    }

    function loadHlsVideo(hlsUrl, linkID, pid, retryCount) {
        const video = document.getElementById('videoPlayer');
        if (!video) {
            console.warn("loadHlsVideo abortado: #videoPlayer no existe en el DOM");
            return;
        }
        hideErrorOverlay();

        if (window.hlsPlayer) {
            window.hlsPlayer.detachMedia();
            window.hlsPlayer.destroy();
        }

        if (Hls.isSupported()) {
            const settings = getSettings();

            const hls = new Hls({
                // debug: true,
                enableWorker: true,
                lowLatencyMode: false,
                maxBufferLength: settings.maxBufferLength,
                maxMaxBufferLength: settings.maxMaxBufferLength,
                backBufferLength: settings.backBufferLength,
                maxBufferSize: 60 * 1000 * 1000, // 60 MB
                maxBufferHole: 0.5,
                fragLoadPolicy: {
                    default: {
                        maxTimeToFirstByteMs: 30000,
                        maxLoadTimeMs: 120000,
                        timeoutRetry: {
                            maxNumRetry: 1,
                            retryDelayMs: 1000,
                            maxRetryDelayMs: 8000
                        },
                        errorRetry: {
                            maxNumRetry: 1,
                            retryDelayMs: 1000,
                            maxRetryDelayMs: 8000
                        }
                    }
                },
                playlistLoadPolicy: {
                    default: {
                        maxTimeToFirstByteMs: 30000,
                        maxLoadTimeMs: 120000,
                        timeoutRetry: {
                            maxNumRetry: 1,
                            retryDelayMs: 1000,
                            maxRetryDelayMs: 8000
                        },
                        errorRetry: {
                            maxNumRetry: 1,
                            retryDelayMs: 1000,
                            maxRetryDelayMs: 8000
                        }
                    }
                },
                manifestLoadPolicy: {
                    default: {
                        maxTimeToFirstByteMs: 30000,
                        maxLoadTimeMs: 120000,
                        timeoutRetry: {
                            maxNumRetry: 1,
                            retryDelayMs: 1000,
                            maxRetryDelayMs: 8000
                        },
                        errorRetry: {
                            maxNumRetry: 1,
                            retryDelayMs: 1000,
                            maxRetryDelayMs: 8000
                        }
                    }
                },
                capLevelToPlayerSize: true,
                startLevel: -1,
                enableSoftwareAES: true
            });
            window.hlsPlayer = hls;

            hls.on(Hls.Events.MEDIA_ATTACHED, function () {
                console.log("HLS.js: Media attached");
            });

            hls.on(Hls.Events.MANIFEST_PARSED, function (event, data) {
                console.log("HLS.js: Manifest parsed. Niveles de calidad: ", data.levels.length);
                console.log('Pistas de audio:', hls.audioTracks);
                if (hls.audioTracks && hls.audioTracks.length > 0) {
                    hls.audioTrack = 0;
                    console.log(`🔊 Pista de audio seleccionada: ${hls.audioTracks[0].name || 'default'}`);
                }
                setTimeout(() => {
                    video.play().then(() => {
                        console.log("Reproducción iniciada automáticamente.");
                    }).catch(e => {
                        console.warn("Autoplay bloqueado o fallido:", e);
                    });
                }, settings.prebufferTime * 1000);
            });

            hls.on(Hls.Events.ERROR, function (event, data) {
                if (data.fatal) {
                    switch (data.type) {
                        case Hls.ErrorTypes.NETWORK_ERROR:
                            console.error("HLS.js: Error de red fatal", data);

                            if (retryCount < MAX_RETRIES) {
                                console.log(`Reintentando... (intento ${retryCount + 1}/${MAX_RETRIES})`);
                                setTimeout(() => {
                                    loadHlsVideo(hlsUrl, linkID, pid, retryCount + 1);
                                }, 2000 * (retryCount + 1)); // backoff exponencial
                            } else {
                                console.error("Máximo de reintentos alcanzado. No se puede cargar el stream.");
                                showErrorOverlay('No se puede cargar el stream', 'El canal no está disponible o el enlace ha expirado.');
                            }
                            break;
                        case Hls.ErrorTypes.MEDIA_ERROR:
                            console.error("HLS.js: Error de medios fatal", data);
                            // HEVC/H.265 no soportado -> evita bucle infinito de Media attached
                            const isHevcError = data.details === 'mediaSourceRequiresReset' || data.details === 'bufferAppendingError';
                            if (isHevcError) {
                                const hevcSupported = MediaSource.isTypeSupported('video/mp4; codecs="hvc1.1.6.L120.B0"') ||
                                                      MediaSource.isTypeSupported('video/mp4; codecs="hev1.1.6.L120.B0"') ||
                                                      MediaSource.isTypeSupported('video/mp4; codecs="hvc1.1.6.L93.B0"');
                                if (!hevcSupported) {
                                    console.warn('HEVC no soportado en este navegador');
                                    showErrorOverlay('Codec no soportado (HEVC/H.265)',
                                        `Este canal emite en HEVC y tu navegador no lo puede decodificar.<br><br>` +
                                        `Prueba en <b>VLC</b> → Abrir red:<br><code style="font-size:12px;word-break:break-all">http://${window.location.hostname}:6878/ace/getstream?id=${linkID}</code><br><br>` +
                                        `O usa Safari/Edge con extensión HEVC.`);
                                    hls.destroy();
                                    window.hlsPlayer = null;
                                    break;
                                }
                            }
                            // Limitar reintentos de mediaError para no ciclar "Media attached" infinito
                            hls._mediaErrorCount = (hls._mediaErrorCount || 0) + 1;
                            if (hls._mediaErrorCount > 3) {
                                showErrorOverlay('Error de reproducción',
                                    `Codec o stream incompatible (${data.details}). Prueba otro Link o ábrelo en VLC.`);
                                hls.destroy();
                                window.hlsPlayer = null;
                                break;
                            }
                            try { hls.recoverMediaError(); } catch(e) { console.error(e); }
                            break;
                        default:
                            console.error("HLS.js: Error fatal", data);
                            hls.destroy();
                            window.hlsPlayer = null;
                            break;
                    }
                } else {
                    console.warn("HLS.js: Error (no fatal)", data);
                }
            });

            try {
                hls.loadSource(hlsUrl);
                hls.attachMedia(video);
            } catch (e) {
                console.error("Error al inicializar HLS.js:", e);
            }
        }
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            console.log("Usando soporte HLS nativo del navegador (Safari).");
            video.src = hlsUrl;
            video.addEventListener('loadedmetadata', function () {
                video.play().then(() => {
                    console.log("Reproducción iniciada en Safari.");
                }).catch(e => {
                    console.warn("Autoplay bloqueado en Safari:", e);
                });
            });
            video.addEventListener('error', function (e) {
                console.error("Error de video en Safari:", video.error);
            });
        } else {
            console.error("Este navegador no soporta HLS.");
        }
    }


    document.getElementById('apply-settings').addEventListener('click', function () {
        console.log("Botón 'Aplicar Configuración' presionado.");
        loadVideo();
    });
    window.addEventListener("DOMContentLoaded", loadVideo);

</script>
