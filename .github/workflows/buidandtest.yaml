name: Build Test Scan and Publish
on:
  push:
    branches:
      - main
  pull_request:

# Don't run multiple releases concurrently.
concurrency: release

jobs:
  build-test-image:
    name: Build Image for Testing
    runs-on: ubuntu-26.04
    permissions:
      packages: write
    steps:
      # Sin checkout, buildx carga el contexto desde el repo remoto y falla al
      # no encontrar el Dockerfile: de ahí el error "no such file or directory".
      - uses: actions/checkout@v7

      - name: Cache and Install apt (.deb) Packages
        uses: eth-pkg/apt-deb-cache@v0.2.7
        with:
          packages: 'megatools'

      # assets/ está en .gitignore (son ~100 MB) pero el build no puede
      # compilar sin ellos: tor.go y acestream.go hacen go:embed de los bundles
      # de Tor, y aceasset_linux.go del tar.gz del motor (el Dockerfile
      # compila con GOOS=linux, así que el motor Windows no hace falta).
      - name: Download embedded assets
        run: |
          if [ -z "${{ secrets.URL_ASSET_ACE_LINUX_TARBALL }}" ]; then
            echo "::error::Falta el secret URL_ASSET_ACE_LINUX_TARBALL. El Dockerfile compila para linux y aceasset_linux.go hace go:embed del tar.gz del motor."
            exit 1
          fi
          megadl --debug=OPTS --path ./assets/ ${{ secrets.URL_ASSET_TOR_WINDOWS_ZIPPED }}
          megadl --debug=OPTS --path ./assets/ ${{ secrets.URL_ASSET_TOR_LINUX_ZIPPED }}
          megadl --debug=OPTS --path ./assets/ ${{ secrets.URL_ASSET_ACE_LINUX_TARBALL }}
          if [ ! -f ./assets/acestream-runtime-linux-x86_64.tar.gz ]; then
            mv ./assets/*.tar.gz ./assets/acestream-runtime-linux-x86_64.tar.gz
          fi
          ls -la ./assets/

      # scripts/Dockerfile hace COPY ./certs/, y certs/ no está en el repo
      # (lo genera scripts/generate-cert.sh en local). mkdir lo evita.
      - name: Prepare certs dir
        run: mkdir -p ./certs

      - name: Setup docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to github registry ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push to GHCR
        uses: docker/build-push-action@v7
        with:
          file: ./scripts/Dockerfile
          push: true
          tags: ghcr.io/${{ github.actor }}/${{ github.event.repository.name }}:${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  test-unit:
    name: Unit tests in Docker
    needs: [build-test-image]
    runs-on: ubuntu-26.04
    permissions:
      packages: read
    steps:
      - name: Checkout git repo
        uses: actions/checkout@v7

      - name: Login to github registry ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Unit Testing
        run: |
          go test update/need_test.go update/need.go update/auto.go update/version.go

  test-integration:
    name: Integration tests in Compose
    needs: [build-test-image]
    runs-on: ubuntu-26.04
    permissions:
      packages: read
    steps:
      - name: Checkout git repo
        uses: actions/checkout@v7
      
      - name: Login to github registry ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # solo testing de healthcheck
      # - name: Test healthcheck in Docker Compose
      #   run: |
      #     export TESTING_IMAGE=ghcr.io/${{ github.actor }}/${{ github.event.repository.name }}:${{ github.run_id }}
      #     echo 'Testing image: "$TESTING_IMAGE"'
      #     echo 'docker compose -f docker-compose.test.yml up --exit-code-from test-integration-app'

  scan-image:
    name: Scan Image with Trivy
    needs: [build-test-image]
    runs-on: ubuntu-26.04

    permissions:
      contents: read # for actions/checkout to fetch code
      packages: read # needed to pull docker image to ghcr.io
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
    steps:
      - name: Checkout git repo
        uses: actions/checkout@v7
          
      - name: Login to github registry ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image to scan
        run: docker pull ghcr.io/${{ github.actor }}/${{ github.event.repository.name }}:${{ github.run_id }}
        
      - name: Run Trivy for all CVEs
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.actor }}/${{ github.event.repository.name }}:${{ github.run_id }}
          format: table
          exit-code: 0
  
  build-windows:
    name: Build ${{ matrix.arch }} windows
    # needs: [scan-image]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    strategy:
      matrix:
        goos: [windows]
        goarch: [amd64]
        artifact_name: [portable.exe]

    steps:
      - uses: actions/checkout@v7
      - name: Cache and Install apt (.deb) Packages
        uses: eth-pkg/apt-deb-cache@v0.2.7
        with:
          packages: 'megatools'

      - name: Descargar assets
        run: |
          # Los assets van por secret y assets/ está en .gitignore, así que si
          # falta uno megadl se queda con un argumento vacío y aborta con un
          # "No links specified" que no dice qué falta. Fallar aquí con el
          # nombre del secret hace el diagnóstico trivial.
          if [ -z "${{ secrets.URL_ASSET_ACE_ZIPPED }}" ]; then
            echo "::error::Falta el secret URL_ASSET_ACE_ZIPPED (Settings > Secrets and variables > Actions)."
            echo "Sube a Mega el ZIP del motor Windows y pega ahí su URL."
            exit 1
          fi
          megadl --debug=OPTS --path ./assets/ ${{ secrets.URL_ASSET_ACE_ZIPPED }}
          megadl --debug=OPTS --path ./assets/ ${{ secrets.URL_ASSET_TOR_WINDOWS_ZIPPED }}
          megadl --debug=OPTS --path ./assets/ ${{ secrets.URL_ASSET_TOR_LINUX_ZIPPED }}
          ls -la ./assets/

      - name: Build binary
        run: |
          export VERSION_BUILD=$(date -u "+%Y-%m-%dT%H:%M:%SZ")
          echo ${VERSION_BUILD} > date_build_${{ matrix.artifact_name }}.txt

          # Cargar variables de entorno desde .env.prod
          if [ -f ".env.prod" ]; then
              export $(cat .env.prod | xargs)
          else
              echo "❌ Archivo .env.prod no encontrado."
              exit 1
          fi

          # Verificar que las variables de entorno se cargaron correctamente
          echo "🛠️ Variables de entorno cargadas:"
          echo "ENV: $ENV"
          echo "CGO_ENABLED: $CGO_ENABLED"

          # La arquitectura sale de la matriz, no de .env.prod: antes el build
          # llevaba GOARCH=amd64 hardcodeado mientras el log anunciaba el
          # GOARCH de .env.prod, así que un binario de 32 bits habría salido
          # amd64 sin que nadie se enterase.
          echo "🚀 Compilando para ${{ matrix.goos }}/${{ matrix.goarch }}..."
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags="-X 'main/update.VersionBuild=${VERSION_BUILD}'" -o ./build/${{ matrix.artifact_name }}
          echo "✅ Compilación exitosa: ./build/${{ matrix.artifact_name }}"

      - name: Vet and unit tests
        run: |
          # Sin este paso el código de este job (incluido el bypass DNS/VAST del
          # motor) no lo cubre ningún test: el único go test de Windows eran
          # 4 ficheros sueltos de update/ y go test ./... solo vivía en el job
          # de Linux.
          go vet ./...
          # El módulo se llama "main", que no es importable, así que go test
          # sobre el paquete raíz falla con "cannot import main". Se prueba en
          # una copia con el módulo renombrado, igual que en build-linux.
          cp -r . /tmp/t && cd /tmp/t
          sed -i 's|^module main$|module acestreamtest|' go.mod
          sed -i 's|"main/update"|"acestreamtest/update"|' main.go server.go
          go test ./...




      - name: Upload binaries to release
        uses: softprops/action-gh-release@v3
        with:
          name: "Release"
          body: "Nueva version"
          draft: false
          prerelease: false
          tag_name: latest
          files: |
            ./build/${{ matrix.artifact_name }}
            date_build_${{ matrix.artifact_name }}.txt

  # Build de linux/amd64 con el motor de Linux (tar.gz con acestreamengine ELF).
  # Sube artefacto de workflow, no al release, para no competir con el job de
  # Windows por la release "latest".
  build-linux:
    name: Build linux/amd64
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - name: Cache and Install apt (.deb) Packages
        uses: eth-pkg/apt-deb-cache@v0.2.7
        with:
          packages: 'megatools'

      - name: Descargar assets
        run: |
          # Fallar aquí con un mensaje claro es mejor que dejar que megadl reciba
          # un argumento vacío y aborte con "No links specified for download",
          # que no dice qué secret falta.
          if [ -z "${{ secrets.URL_ASSET_ACE_LINUX_TARBALL }}" ]; then
            echo "::error::Falta el secret URL_ASSET_ACE_LINUX_TARBALL (Settings > Secrets and variables > Actions)."
            echo "Sube a Mega el tar.gz del motor Linux y pega ahí su URL."
            exit 1
          fi
          megadl --debug=OPTS --path ./assets/ ${{ secrets.URL_ASSET_ACE_LINUX_TARBALL }}
          megadl --debug=OPTS --path ./assets/ ${{ secrets.URL_ASSET_TOR_WINDOWS_ZIPPED }}
          megadl --debug=OPTS --path ./assets/ ${{ secrets.URL_ASSET_TOR_LINUX_ZIPPED }}
          # go:embed exige el nombre exacto y el fichero de Mega puede venir con
          # otro (p. ej. acestream_3.2.11_ubuntu_22.04_x86_64_py3.10.tar.gz).
          if [ ! -f ./assets/acestream-runtime-linux-x86_64.tar.gz ]; then
            mv ./assets/*.tar.gz ./assets/acestream-runtime-linux-x86_64.tar.gz
          fi
          ls -la ./assets/

      - name: Build
        run: |
          export VERSION_BUILD=$(date -u "+%Y-%m-%dT%H:%M:%SZ")
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-X 'main/update.VersionBuild=${VERSION_BUILD}'" -o ./build/portable .

      - name: Unit tests
        run: |
          # El módulo se llama "main", que no es importable, así que go test
          # sobre el paquete raíz falla con "cannot import main". Se prueba en
          # una copia con el módulo renombrado.
          cp -r . /tmp/t && cd /tmp/t
          sed -i 's|^module main$|module acestreamtest|' go.mod
          sed -i 's|"main/update"|"acestreamtest/update"|' main.go server.go
          go test ./...

      - uses: actions/upload-artifact@v4
        with:
          name: portable-linux-amd64
          path: ./build/portable

